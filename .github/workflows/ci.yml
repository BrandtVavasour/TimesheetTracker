name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TimesheetTracker.slnx

      - name: Build
        run: dotnet build TimesheetTracker.slnx --no-restore --configuration Release

      - name: Test
        env:
          DiffEngine_Disabled: 'true'
        # Docker-gated Testcontainers tests are [Explicit] and excluded here;
        # everything else runs against EF InMemory, no services required.
        run: dotnet test TimesheetTracker.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
