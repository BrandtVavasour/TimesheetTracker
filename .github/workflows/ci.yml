name: CI

# Build and run the test suite on every push and pull request.
# (Deployment is handled separately and is not part of this public workflow.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TimesheetTracker.slnx

      - name: Build
        run: dotnet build TimesheetTracker.slnx --configuration Release --no-restore

      - name: Test
        env:
          DiffEngine_Disabled: 'true'
        run: dotnet test TimesheetTracker.slnx --configuration Release --no-build --verbosity normal
