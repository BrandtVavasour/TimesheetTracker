name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: gitea.jabtech.com.au
  DOTNET_VERSION: '10.0.x'

jobs:
  # Stage 1: Restore, build, and run the test suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore TimesheetTracker.slnx

      - name: Build
        run: dotnet build TimesheetTracker.slnx --configuration Release --no-restore

      - name: Test
        env:
          # Verify snapshots: never launch a diff tool on the runner.
          # The Testcontainers (Postgres) test is [Explicit] and is skipped here.
          DiffEngine_Disabled: 'true'
        run: dotnet test TimesheetTracker.slnx --configuration Release --no-build --verbosity normal

  # Stage 2: Build and push the web image (main only).
  build-web-image:
    needs: test
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          network: host
          build-args: |
            UID=3002
            GID=3002
          tags: |
            ${{ env.REGISTRY }}/${{ gitea.repository }}-web:latest
            ${{ env.REGISTRY }}/${{ gitea.repository }}-web:${{ gitea.sha }}

  # Stage 3: Trigger Portainer to re-pull and redeploy the stack.
  deploy:
    needs: build-web-image
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
        run: curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
