<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!--[if !mso]><!-- -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--<![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{app_title}}</title>
    <style>
      html, body { margin: 0 !important; padding: 0 !important; min-height: 100% !important; width: 100% !important; -webkit-font-smoothing: antialiased; }
      * { -ms-text-size-adjust: 100%; }
      #outlook a { padding: 0; }
      .ReadMsgBody, .ExternalClass { width: 100%; }
      .ExternalClass, .ExternalClass p, .ExternalClass td, .ExternalClass div, .ExternalClass span, .ExternalClass font { line-height: 100%; }
      table, td, th { mso-table-lspace: 0 !important; mso-table-rspace: 0 !important; border-collapse: collapse; }
      body, td, th, p, div, li, a, span { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; mso-line-height-rule: exactly; }
      img { border: 0; outline: 0; line-height: 100%; text-decoration: none; -ms-interpolation-mode: bicubic; }
      a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
      @media (max-width: 620px) {
        .pc-project-body { min-width: 0px !important; }
        .pc-project-container, .pc-component { width: 100% !important; }
        .pc-w620-padding-30 { padding: 28px 28px 28px 28px !important; }
        .pc-w620-padding-35 { padding: 32px 28px 32px 28px !important; }
      }
    </style>
    <!--[if mso]>
      <style type="text/css">.pc-font-alt { font-family: Arial, Helvetica, sans-serif !important; }</style>
    <![endif]-->
    <!--[if gte mso 9]>
      <xml><o:OfficeDocumentSettings><o:AllowPNG /><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
    <![endif]-->
  </head>

  <body class="body pc-font-alt" bgcolor="#f4f6f6" style="width:100% !important;min-height:100% !important;margin:0 !important;padding:0 !important;font-weight:normal;color:#19201e;mso-line-height-rule:exactly;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;text-rendering:optimizeLegibility;-moz-osx-font-smoothing:grayscale;background-color:#f4f6f6;">
    <table class="pc-project-body" bgcolor="#f4f6f6" border="0" cellspacing="0" cellpadding="0" role="presentation" style="table-layout:fixed;width:100%;min-width:600px;background-color:#f4f6f6;">
      <tr>
        <td align="center" valign="top" style="width:auto;">
          <table class="pc-project-container" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation">
            <tr>
              <td style="padding:24px 0px 24px 0px;" align="left" valign="top">
                <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">

                  <!-- Header -->
                  <tr>
                    <td valign="top">
                      <table class="pc-component" width="600" align="center" border="0" cellspacing="0" cellpadding="0" role="presentation" style="width:600px;max-width:600px;">
                        <tr>
                          <td valign="top" bgcolor="#1f9d63" class="pc-w620-padding-30" style="padding:26px 40px 26px 40px;background-color:#1f9d63;border-radius:14px 14px 0 0;">
                            <div class="pc-font-alt" style="font-size:21px;line-height:28px;text-align:center;color:#ffffff;font-family:'Hanken Grotesk',Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:-0.2px;">
                              {{app_title}}
                            </div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <!-- Content -->
                  <tr>
                    <td valign="top">
                      <table class="pc-component" width="600" align="center" border="0" cellspacing="0" cellpadding="0" role="presentation" style="width:600px;max-width:600px;">
                        <tr>
                          <td valign="top" bgcolor="#ffffff" class="pc-w620-padding-35" style="padding:40px 44px 40px 44px;background-color:#ffffff;">
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                              <tr>
                                <td align="center" valign="top" style="padding:0px 0px 12px 0px;">
                                  <div class="pc-font-alt" style="line-height:34px;letter-spacing:-0.4px;font-family:'Hanken Grotesk',Arial,Helvetica,sans-serif;font-size:24px;font-weight:bold;color:#19201e;text-align:center;">
                                    {{heading}}
                                  </div>
                                </td>
                              </tr>
                              <tr>
                                <td align="center" valign="top" style="padding:0px 0px 24px 0px;">
                                  <div class="pc-font-alt" style="line-height:26px;letter-spacing:-0.2px;font-family:'Hanken Grotesk',Arial,Helvetica,sans-serif;font-size:16px;font-weight:normal;color:#545d5b;text-align:center;">
                                    {{subheading}}
                                  </div>
                                </td>
                              </tr>
                            </table>
                            {{button_content}}
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <!-- Footer -->
                  <tr>
                    <td valign="top">
                      <table class="pc-component" width="600" align="center" border="0" cellspacing="0" cellpadding="0" role="presentation" style="width:600px;max-width:600px;">
                        <tr>
                          <td valign="top" bgcolor="#f6f8f8" style="padding:18px 20px 20px 20px;background-color:#f6f8f8;border-radius:0 0 14px 14px;border-top:1px solid #e6eaea;">
                            <div style="font-size:13px;line-height:18px;text-align:center;color:#8a9291;font-family:'Hanken Grotesk',Arial,Helvetica,sans-serif;letter-spacing:-0.1px;">
                              {{app_title}} · This is an automated message — please don't reply.
                            </div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
